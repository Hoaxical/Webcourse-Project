<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="icon" type="image/png" href="images/ArmwareLogo.png">

    <link rel="stylesheet" href="teststyles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tomorrow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bruno+Ace+SC&family=Tomorrow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    
    <title>Account Set Up</title>
</head>
<body>

    <div class="setuppageLOGO">

        <div class="setuppageLOGOinterior">

           <img src="images/ArmwareLogo.png">

            <div class="logotext anton-regular">
                <a href="index.php" style="color: white; text-decoration: none;">RMWARE</a>
            </div>

        </div>

    </div>
    
    <div class="headertag1">
        <h1 class="league-spartan">Create Your Armware Account</h1>
    </div>

    <div class="sign-up-box">

        <form name="signup" action="userregistration.php" method="post">

            <label for="fname" class="tomorrow-regular">First Name</label><br>
            <input type="text" id="SignUp-fname" name="fname" required onchange="return fnamecheck()"><br>
        
            <label for="lname" class="tomorrow-regular">Last Name</label><br>
            <input type="text" id="SignUp-lname" name="lname" required onchange="return lnamecheck()"><br>
        
            <label for="Usrname" class="tomorrow-regular">Username</label>
            <input type="text" id="SignUp-Usrname" name="username" required minlength="4" maxlength="20" onchange="return UsernameCheck()"><br>
        
            <label for="emailaddress" class="tomorrow-regular">Email address</label><br>
            <input type="email" id="SignUp-emailaddress" name="email" placeholder="Example: armware@gmail.com" required pattern=".+@.+\..+" onchange="EmailCheck()"><br>
        
            <label for="dateofbirth" class="tomorrow-regular">Date of Birth</label><br>
            <input type="date" id="SignUp-dateofbirth" name="dob" placeholder="dd/mm/yyyy" required><br>
        
            <label for="password" class="tomorrow-regular">Password</label><br>
            <input type="password" id="SignUp-password" name="password" placeholder="Minimum 8 characters" required minlength="8">
            <button type="button" id="toggle-pass1">Hide/See</button><br>

            <label for="confirm-password" class="tomorrow-regular">Confirm Password</label><br>
            <input type="password" id="SignUp-confirmpassword" name="confirm-password" required onchange="return checkpassword()">
            <button type="button" id="toggle-pass2">Hide/See</button><br>


            <p>By clicking 'Sign Up', you agree to all <a href="armwaresignupTermsConditions.html">Terms and conditions</a> of ArmWare.</p>
            
            <input type="submit" value="Sign Up" id="SignUp-button">
        
            <p style="font-size: 20px;">Already have an account? Click <a href="armwaresignIn.html">Sign In</a></p>
        
        </form>
        
    </div>

    <!-- JQuery CDN (Add before your script) -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>
$(document).ready(function(){

// First Name Check
function fnamecheck() {
    var fname = $('#SignUp-fname').val();
    if (fname.length === 0) {
        alert("First name invalid");
        return false;
    }
    return true;
}

// Last Name Check
function lnamecheck() {
    var lname = $('#SignUp-lname').val();
    if (lname.length === 0) {
        alert("Last name invalid");
        return false;
    }
    return true;
}

// Username Check (real-time)
function UsernameCheck() {
    var username = $('#SignUp-Usrname').val().trim();
    var specialcharacters = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]+/;

    if (specialcharacters.test(username)) {
        alert("Username cannot contain special characters");
        $('#SignUp-Usrname').val('');
        return;
    }

    if (username !== '') {
        $.ajax({
            url: 'ajax/check_username.php',
            method: 'POST',
            data: { username: username },
            success: function(response) {
                if (response === 'taken') {
                    alert('Username already exists. Please choose another.');
                    $('#SignUp-Usrname').val('');
                }
            }
        });
    }
}

// Email Check (real-time)
function EmailCheck() {
    var email = $('#SignUp-emailaddress').val().trim();
    var emailFormat = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    
    if (!emailFormat.test(email)) {
        alert('Invalid email format.');
        $('#SignUp-emailaddress').val('');
        return;
    }

    if (email !== '') {
        $.ajax({
            url: 'ajax/check_email.php',
            method: 'POST',
            data: { email: email },
            success: function(response) {
                console.log('Server Response:', response); // Debugging
                if (response === 'taken') {
                    alert('Email is already registered. Please use another email.');
                    $('#SignUp-emailaddress').val('');
                }
            }
        });
    }
}

// Password Match Check
function checkpassword() {
    var password = $('#SignUp-password').val();
    var confirmpassword = $('#SignUp-confirmpassword').val();

    if (password !== confirmpassword) {
        alert("Passwords do not match");
        $('#SignUp-confirmpassword').val('');
        return false;
    }
    return true;
}

// Toggle password visibility
$('#toggle-pass1').click(function() {
    var passField = $('#SignUp-password');
    if (passField.attr('type') === 'password') {
        passField.attr('type', 'text');
    } else {
        passField.attr('type', 'password');
    }
});

$('#toggle-pass2').click(function() {
    var confirmPassField = $('#SignUp-confirmpassword');
    if (confirmPassField.attr('type') === 'password') {
        confirmPassField.attr('type', 'text');
    } else {
        confirmPassField.attr('type', 'password');
    }
});

// Attach real-time validation (on blur)
$('#SignUp-fname').on('blur', fnamecheck);
$('#SignUp-lname').on('blur', lnamecheck);
$('#SignUp-emailaddress').on('blur', EmailCheck);
$('#SignUp-Usrname').on('blur', UsernameCheck);
$('#SignUp-confirmpassword').on('blur', checkpassword);

});

</script>

    
</body>

</html>
